<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Announcements – Car Parking System</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #09090b; --surface: #18181b; --border: #27272a;
            --primary: #f97316; --primary-hover: #ea580c; --accent: #fbbf24;
            --text-main: #f8fafc; --text-muted: #a1a1aa;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 15% 50%, rgba(249, 115, 22, 0.08) 0%, transparent 40%),
                radial-gradient(ellipse at 85% 30%, rgba(251, 191, 36, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 5rem;
        }

        .navbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 2rem; background: rgba(9, 9, 11, 0.7);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(16px);
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
        }
        .nav-left { display: flex; align-items: center; gap: 1rem; }
        .logo-box {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; font-weight: 800; color: #000;
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.4);
        }
        .brand-name { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }

        .btn-back {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main); padding: 0.5rem 1rem; border-radius: 8px;
            font-weight: 500; cursor: pointer; transition: all 0.2s;
            text-decoration: none;
            display: inline-flex; align-items: center; gap: 0.5rem;
        }
        .btn-back:hover { background: rgba(255, 255, 255, 0.1); }

        .container {
            background: rgba(24, 24, 27, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 800px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            margin-top: 2rem;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-content { margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center; }
        .header-content h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 0.5rem; }
        .header-content p { color: var(--text-muted); font-size: 0.95rem; }

        .btn-create {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #000; padding: 0.75rem 1.5rem; border-radius: 8px; border: none;
            font-weight: 700; font-size: 0.95rem; cursor: pointer; text-decoration: none;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-create:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(249, 115, 22, 0.4); }

        .announcements-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .announcement-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: transform 0.2s, border-color 0.2s;
        }
        .announcement-card:hover {
            transform: translateY(-2px);
            border-color: rgba(249, 115, 22, 0.3);
        }

        .ann-info { flex: 1; }
        .ann-type {
            display: inline-block; padding: 0.2rem 0.6rem; border-radius: 6px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem;
        }
        .t-slot { background: rgba(74,222,128,0.12); color: #4ade80; }
        .t-alert { background: rgba(248,113,113,0.12); color: #fca5a5; }
        .t-general { background: rgba(161,161,170,0.12); color: #a1a1aa; }
        .t-promo { background: rgba(34,211,238,0.12); color: #22d3ee; }

        .ann-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .ann-body { font-size: 0.95rem; color: #d4d4d8; line-height: 1.5; white-space: pre-wrap; margin-bottom: 0.75rem; }
        .ann-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 1rem; }

        .btn-delete {
            background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171; padding: 0.5rem 1rem; border-radius: 8px;
            font-weight: 600; cursor: pointer; transition: all 0.2s;
            margin-left: 1rem;
        }
        .btn-delete:hover { background: rgba(239, 68, 68, 0.2); }

        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
        .empty-state-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }

        /* Success/Error Message styling */
        .toast {
            position: fixed;
            bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #22c55e;
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-left">
            <div class="logo-box">🅿️</div>
            <div class="brand-name">ParkMatrix</div>
        </div>
        <a href="Owner page.html" class="btn-back">← Back to Dashboard</a>
    </nav>

    <div class="container">
        <div class="header-content">
            <div>
                <h2>My Announcements</h2>
                <p>Manage the announcements and updates you have posted.</p>
            </div>
            <a href="Create Announcement.html" class="btn-create">+ New Announcement</a>
        </div>
        
        <div id="announcementsList" class="announcements-list">
            <div style="text-align: center; padding: 2rem; color: var(--text-muted);">Loading announcements...</div>
        </div>
    </div>

    <div id="toast" class="toast">Action completed!</div>

    <script>
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.background = isError ? "#ef4444" : "#22c55e";
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function loadAnnouncements() {
            fetch('http://localhost:5000/api/announcements')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('announcementsList');
                    if (data.success && data.announcements.length > 0) {
                        list.innerHTML = data.announcements.map(a => {
                            let typeClass = 't-general';
                            if (a.type === 'slot') typeClass = 't-slot';
                            if (a.type === 'alert') typeClass = 't-alert';
                            if (a.type === 'promo') typeClass = 't-promo';

                            return `
                                <div class="announcement-card" id="ann-${a._id}">
                                    <div class="ann-info">
                                        <div class="ann-type ${typeClass}">${a.type}</div>
                                        <div class="ann-title">${a.title}</div>
                                        <div class="ann-body">${a.body}</div>
                                        <div class="ann-meta">
                                            <span>📅 Expiry: ${a.expiry || 'N/A'}</span>
                                            <span>📍 ${a.lot || 'Your Parking Lot'}</span>
                                        </div>
                                    </div>
                                    <button class="btn-delete" onclick="deleteAnnouncement('${a._id}')">Delete</button>
                                </div>
                            `;
                        }).join('');
                    } else {
                        list.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-state-icon">📭</div>
                                <h3>No Announcements Found</h3>
                                <p style="margin-top: 0.5rem;">You haven't posted any announcements yet.</p>
                            </div>
                        `;
                    }
                })
                .catch(err => {
                    console.error('Error fetching announcements:', err);
                    document.getElementById('announcementsList').innerHTML = '<div style="color:#ef4444; padding:2rem; text-align:center;">Failed to load announcements.</div>';
                });
        }

        function deleteAnnouncement(id) {
            if (!confirm('Are you sure you want to delete this announcement?')) return;
            
            fetch(`http://localhost:5000/api/announcements/${id}`, {
                method: 'DELETE'
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast('Announcement deleted successfully!');
                    loadAnnouncements(); // Reload the list
                } else {
                    showToast('Failed to delete announcement', true);
                }
            })
            .catch(err => {
                showToast('Error deleting announcement', true);
            });
        }

        // Load initially
        loadAnnouncements();
    </script>
</body>
</html>
